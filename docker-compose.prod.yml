version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - Jwt__SecretKey=${JWT_SECRET_KEY}
      - Jwt__Issuer=MTI.ProjectManagement.Api
      - Jwt__Audience=MTI.ProjectManagement.Client
      - BackblazeB2__KeyId=${B2_KEY_ID}
      - BackblazeB2__ApplicationKey=${B2_APPLICATION_KEY}
      - BackblazeB2__BucketName=${B2_BUCKET_NAME:-MTICompany}
      - BackblazeB2__ServiceUrl=https://s3.us-east-005.backblazeb2.com
      - BackblazeB2__DownloadUrl=https://f005.backblazeb2.com
      - Cors__AllowedOrigins__0=https://mti.engineeringsolutions.com
      - Cors__AllowedOrigins__1=http://localhost:3000
    expose:
      - "8080"
    networks:
      - mti_network

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.mti.engineeringsolutions.com
    expose:
      - "3000"
    networks:
      - mti_network

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    networks:
      - mti_network

networks:
  mti_network:
    driver: bridge
